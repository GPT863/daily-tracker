<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端连接测试 - DailyTracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .test-section {
            margin-bottom: 30px;
        }

        .test-title {
            font-weight: 600;
            color: #444;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .endpoint-url {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            color: #333;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .status {
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .button:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .result-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-box pre {
            margin: 0;
            font-size: 13px;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-card {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-card h3 {
            color: #1976D2;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .info-card p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DailyTracker 后端连接测试</h1>
        <p class="subtitle">测试前端与后端服务的连接状态</p>

        <div class="info-card">
            <h3>📋 测试配置</h3>
            <p>
                <strong>后端地址：</strong> http://170.106.101.55:8081<br>
                <strong>测试时间：</strong> <span id="testTime"></span>
            </p>
        </div>

        <!-- 测试1: 健康检查 -->
        <div class="test-section">
            <div class="test-title">✅ 测试 1: 健康检查接口</div>
            <div class="endpoint-url">GET /health</div>
            <div id="healthStatus" class="status info">⏳ 等待测试...</div>
            <button class="button" onclick="testHealth()">测试健康检查</button>
            <div id="healthResult" class="result-box" style="display: none;"></div>
        </div>

        <!-- 测试2: 认证接口 -->
        <div class="test-section">
            <div class="test-title">🔐 测试 2: 认证接口（需要账号）</div>
            <div class="endpoint-url">POST /api/auth/login</div>
            <div id="authStatus" class="status info">⏳ 等待测试...</div>
            <button class="button" onclick="testAuth()">测试登录接口</button>
            <div id="authResult" class="result-box" style="display: none;"></div>
        </div>

        <!-- 测试3: 快照接口 -->
        <div class="test-section">
            <div class="test-title">💾 测试 3: 快照接口（需要登录）</div>
            <div class="endpoint-url">GET /snapshot</div>
            <div id="snapshotStatus" class="status info">⏳ 等待测试...</div>
            <button class="button" onclick="testSnapshot()">测试快照接口</button>
            <div id="snapshotResult" class="result-box" style="display: none;"></div>
        </div>

        <!-- 综合测试 -->
        <div class="test-section">
            <div class="test-title">🚀 综合测试：一键测试所有接口</div>
            <button class="button" onclick="runAllTests()">运行所有测试</button>
        </div>

        <div class="footer">
            DailyTracker Backend Connection Test Tool<br>
            如果所有测试通过，说明后端服务运行正常！
        </div>
    </div>

    <script>
        const API_BASE = 'http://170.106.101.55:8081';

        // 显示当前时间
        document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');

        // 测试健康检查
        async function testHealth() {
            const statusEl = document.getElementById('healthStatus');
            const resultEl = document.getElementById('healthResult');

            statusEl.className = 'status info';
            statusEl.innerHTML = '⏳ 测试中...';
            resultEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();

                statusEl.className = 'status success';
                statusEl.innerHTML = `✅ 测试通过 (HTTP ${response.status})`;

                resultEl.style.display = 'block';
                resultEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `❌ 测试失败: ${error.message}`;

                resultEl.style.display = 'block';
                resultEl.innerHTML = `<pre>错误信息: ${error.message}\n\n可能原因:\n1. 后端服务未启动\n2. 服务器地址不正确\n3. 网络连接问题\n4. 跨域限制(CORS)</pre>`;
            }
        }

        // 测试认证接口
        async function testAuth() {
            const statusEl = document.getElementById('authStatus');
            const resultEl = document.getElementById('authResult');

            statusEl.className = 'status info';
            statusEl.innerHTML = '⏳ 测试中...';
            resultEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: 'test',
                        password: 'test123'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusEl.className = 'status success';
                    statusEl.innerHTML = `✅ 测试通过 (HTTP ${response.status})`;
                } else {
                    statusEl.className = 'status error';
                    statusEl.innerHTML = `⚠️ 接口响应正常，但登录失败 (HTTP ${response.status})`;
                }

                resultEl.style.display = 'block';
                resultEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `❌ 测试失败: ${error.message}`;

                resultEl.style.display = 'block';
                resultEl.innerHTML = `<pre>错误信息: ${error.message}</pre>`;
            }
        }

        // 测试快照接口
        async function testSnapshot() {
            const statusEl = document.getElementById('snapshotStatus');
            const resultEl = document.getElementById('snapshotResult');

            statusEl.className = 'status info';
            statusEl.innerHTML = '⏳ 测试中...';
            resultEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/snapshot`);

                if (response.ok) {
                    const data = await response.json();
                    statusEl.className = 'status success';
                    statusEl.innerHTML = `✅ 测试通过 (HTTP ${response.status}) - 有数据`;
                    resultEl.style.display = 'block';
                    resultEl.innerHTML = `<pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>`;
                } else if (response.status === 204) {
                    statusEl.className = 'status success';
                    statusEl.innerHTML = `✅ 测试通过 (HTTP ${response.status}) - 无数据`;
                    resultEl.style.display = 'block';
                    resultEl.innerHTML = '<pre>云端暂无数据快照</pre>';
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `❌ 测试失败: ${error.message}`;
                resultEl.style.display = 'block';
                resultEl.innerHTML = `<pre>错误信息: ${error.message}</pre>`;
            }
        }

        // 运行所有测试
        async function runAllTests() {
            await testHealth();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testAuth();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testSnapshot();
        }

        // 页面加载后自动测试
        window.addEventListener('load', () => {
            setTimeout(testHealth, 500);
        });
    </script>
</body>
</html>
